[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kite"
version = "0.1.0"
description = "Tello scout drone that guides a visually impaired walker"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",  # Tello UDP video via FFmpeg, webcam, preview windows
    "av>=12",              # PyAV: the default Tello H.264 decoder
    "djitellopy>=2.5",     # Tello commands + state stream (pip 2.5.0 has no tello.stop(): we send "stop" ourselves)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
follow = ["ultralytics>=8.3"]  # kite.follow person detector (YOLO11n); weights: see kite/follow.py, never fetched at runtime
fly = ["scipy>=1.11"]                              # kite.fly: the fly-brain yaw source (sparse LIF network)
train = ["scipy>=1.11", "cma>=3.3", "modal>=1.0"]  # kite.fly.train: CMA-ES fine-tuning, locally or on Modal

[tool.setuptools.packages.find]
include = ["kite*"]

[tool.setuptools.package-data]
"kite.fly" = ["data/*.npz", "data/*.json", "data/init/*.json", "data/reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]  # tests/drone_test.py is a flight script, not a test module
addopts = "-q"
markers = ["slow: needs ffmpeg, streams real H.264 over local UDP"]
filterwarnings = ["ignore::DeprecationWarning"]
