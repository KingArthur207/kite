[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kite"
version = "0.1.0"
description = "Tello scout drone that guides a visually impaired walker"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",  # Tello UDP video via FFmpeg, webcam, preview windows
    "av>=12",              # PyAV: the default Tello H.264 decoder
    "djitellopy>=2.5",     # Tello commands + state stream (pip 2.5.0 has no tello.stop(): we send "stop" ourselves)
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11", "cma>=3.3", "hypothesis>=6.100"]  # kite.fly tests run in the not-slow suite; hypothesis: safety-governor property tests
follow = ["ultralytics>=8.3"]  # kite.follow person detector (YOLO11n); weights: see kite/follow.py, never fetched at runtime
fly = ["scipy>=1.11"]                              # kite.fly: the fly-brain yaw source (sparse LIF network)
train = ["scipy>=1.11", "cma>=3.3", "modal>=1.0"]  # kite.fly.train: CMA-ES fine-tuning, locally or on Modal

[tool.setuptools.packages.find]
include = ["kite*"]

[tool.setuptools.package-data]
"kite.fly" = ["data/*.npz", "data/*.json", "data/init/*.json", "data/reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]  # tests/drone_test.py is a flight script, not a test module
addopts = "-q"
markers = ["slow: needs ffmpeg, streams real H.264 over local UDP"]
filterwarnings = ["ignore::DeprecationWarning"]

# One lint config for the whole repo (earpiece/pyproject.toml extends it), so results don't
# depend on anyone's personal ruff settings. Bug-finding rules only; style is left alone.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["video", "dashboard", "sim/node_modules", "sim/blender", "earpiece/native"]  # blender: runs inside Blender

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W6", "B",
    "PLE",                     # pylint errors: bad format strings, return in __init__, await outside async...
    "T10",                     # a forgotten breakpoint()
    "ISC001",                  # "a" "b" on one line: almost always a missing comma in a list
    "RUF006",                  # create_task() result dropped: the loop holds tasks weakly, so it can vanish
    "PIE794", "PIE796",        # a class attribute or enum value defined twice
    "PLW0120", "PLW0127", "PLW0129", "PLW0602", "PLW0604", "PLW0711", "PLW1501", "PLW2101",  # likely bugs
]
ignore = [
    "E402", "E701", "E702", "E731", "E741",   # imports after sys.path setup, one-liners, named lambdas, short names
    "B007", "B008", "B027",    # unused loop variables, call defaults, empty base-class hooks
    "B904", "B905",            # raise-from inside except, zip(strict=)
]

[tool.ruff.lint.per-file-ignores]
"earpiece/tests/test_rust_sonar.py" = ["B023"]   # closures called inside the loop that defines them
"earpiece/evals/run_live.py" = ["B023"]

