name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"     # weekly, Monday morning: catch newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 -v .

  python:
    name: python (pip-audit, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: earpiece
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[brain,memory,dev]"
      - name: pip-audit (known CVEs in installed packages)
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages --progress-spinner off
      - name: bandit (static analysis, medium and above)
        run: uvx bandit -q -r earpiece -ll

  node:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm audit --audit-level=high
        working-directory: dashboard
      - run: npm ci && npm audit --audit-level=high
        working-directory: dashboard/spacetimedb

  rust:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: earpiece/native
