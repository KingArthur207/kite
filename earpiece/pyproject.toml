[project]
name = "kite-earpiece"
version = "0.1.0"
description = "Kite's AirPods layer: spatial obstacle sonar, waypoint beacon, and a voice assistant for blind pedestrians."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sounddevice>=0.4.6",
  "websockets>=13",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
mac = ["pyobjc-framework-MediaPlayer>=10", "pyobjc-framework-Cocoa>=10", "pyobjc-framework-Quartz>=10"]
brain = ["anthropic>=0.40"]
memory = ["inferedge-moss>=1.0.0b19"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kite-earpiece = "earpiece.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earpiece*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
