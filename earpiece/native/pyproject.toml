[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "kite-audio"
version = "0.1.0"
description = "Rust real-time audio engine for Kite's earpiece"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "kite_audio"
